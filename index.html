<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Airline Explorer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fr-bg: #1a1c21;
            --fr-panel: rgba(26, 28, 33, 0.95);
            --fr-accent: #fccb00; /* フライトレーダーイエロー */
            --fr-text: #f1f1f1;
            --fr-border: #333;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Roboto', sans-serif;
            background: var(--fr-bg); color: var(--fr-text);
            overflow: hidden;
        }

        /* マップ設定 (ダークテーマ) */
        #map { height: 100vh; width: 100vw; z-index: 1; background: #0b0c0d; }

        /* 検索バー (左上) */
        #search-box {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            display: flex; gap: 0; background: var(--fr-bg);
            border-radius: 4px; overflow: hidden; border: 1px solid var(--fr-border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #country-input {
            background: #2a2d34; border: none; color: white; padding: 12px 15px;
            width: 250px; outline: none; font-size: 14px;
        }

        #search-btn {
            background: var(--fr-accent); border: none; padding: 0 15px;
            cursor: pointer; font-weight: bold; color: #000;
        }

        /* サイドパネル (右側) */
        #side-panel {
            position: absolute; right: -400px; top: 0; width: 350px; height: 100%;
            background: var(--fr-panel); z-index: 1001; transition: 0.4s ease;
            border-left: 1px solid var(--fr-border);
            display: flex; flex-direction: column;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        #side-panel.active { right: 0; }

        .panel-header {
            background: #25282e; padding: 25px 20px;
            border-bottom: 3px solid var(--fr-accent);
        }

        .panel-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .panel-header p { margin: 5px 0 0; color: #aaa; font-size: 12px; }

        .panel-content { padding: 20px; flex-grow: 1; overflow-y: auto; }

        .airline-card {
            background: #2a2d34; margin-bottom: 15px; padding: 15px;
            border-radius: 6px; border-left: 4px solid var(--fr-accent);
        }

        .airline-name { font-weight: bold; font-size: 16px; display: block; margin-bottom: 5px; }

        .wiki-btn-container { padding: 20px; background: #25282e; }

        .btn-primary {
            background: var(--fr-accent); color: #000; text-align: center;
            padding: 12px; border-radius: 4px; text-decoration: none;
            display: block; font-weight: bold; transition: 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        #close-panel {
            position: absolute; left: -40px; top: 15px;
            background: var(--fr-panel); border: 1px solid var(--fr-border);
            color: white; padding: 10px; cursor: pointer; border-radius: 4px 0 0 4px;
        }

        /* ローディング */
        #loader {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 2000;
            color: var(--fr-accent); font-weight: bold;
        }

        /* Leafletの著作権表示をダークに */
        .leaflet-container { background: #0b0c0d !important; }
        .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: #777 !important; }
    </style>
</head>
<body>

    <div id="loader">SEARCHING WIKIPEDIA...</div>

    <div id="search-box">
        <input type="text" id="country-input" placeholder="Search country (Japan, France...)" list="countries">
        <datalist id="countries"></datalist>
        <button id="search-btn">GO</button>
    </div>

    <div id="side-panel">
        <button id="close-panel">✕</button>
        <div class="panel-header">
            <p id="label-capital">CAPITAL CITY</p>
            <h1 id="panel-country-name">COUNTRY</h1>
        </div>
        <div class="panel-content">
            <h3 style="color: var(--fr-accent); font-size: 12px; text-transform: uppercase;">Major Airlines</h3>
            <div id="airline-results">
                </div>
        </div>
        <div class="wiki-btn-container">
            <a id="wiki-external-link" href="#" target="_blank" class="btn-primary">WIKIPEDIA LIST</a>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 設定 ---
        const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
        
        // ダークモードタイル (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 有名航空会社の判定キーワード
        const flagshipKeywords = ["航空", "Air", "Airlines", "Airways", "National", "International", "Lineas"];

        // --- Wikipedia API ---
        async function getAirlines(country) {
            document.getElementById('loader').style.display = 'block';
            
            let categoryName = country;
            // 例外処理
            if (country === "中国" || country === "中華人民共和国") categoryName = "中華人民共和国";
            else if (country === "北朝鮮" || country === "朝鮮民主主義人民共和国") categoryName = "朝鮮民主主義人民共和国";
            else if (country === "アメリカ" || country === "アメリカ合衆国") categoryName = "アメリカ合衆国";

            const wikiCategory = `Category:${categoryName}の航空会社`;
            const apiUrl = `https://ja.wikipedia.org/w/api.php?origin=*&action=query&list=categorymembers&cmtitle=${encodeURIComponent(wikiCategory)}&cmlimit=100&format=json`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';

                if (!data.query || !data.query.categorymembers) return [];

                let list = data.query.categorymembers
                    .map(m => m.title)
                    .filter(t => !t.includes("Category:") && !t.includes("Template:") && !t.includes("一覧"));

                // 有名そうな順にソート (キーワードマッチング)
                list.sort((a, b) => {
                    let scoreA = flagshipKeywords.some(k => a.includes(k)) ? 1 : 0;
                    let scoreB = flagshipKeywords.some(k => b.includes(k)) ? 1 : 0;
                    return scoreB - scoreA;
                });

                return {
                    airlines: list.slice(0, 3),
                    url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(wikiCategory)}`
                };
            } catch (e) {
                document.getElementById('loader').style.display = 'none';
                return null;
            }
        }

        // --- UI操作 ---
        function updatePanel(countryName, capital, airlineData) {
            document.getElementById('panel-country-name').textContent = countryName.toUpperCase();
            document.getElementById('label-capital').textContent = capital ? `CAPITAL: ${capital.toUpperCase()}` : "COUNTRY INFO";
            
            const container = document.getElementById('airline-results');
            container.innerHTML = '';

            if (airlineData && airlineData.airlines.length > 0) {
                airlineData.airlines.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'airline-card';
                    div.innerHTML = `<span class="airline-name">${name}</span><span style="color:#777; font-size:11px;">Active Carrier</span>`;
                    container.appendChild(div);
                });
                document.getElementById('wiki-external-link').href = airlineData.url;
            } else {
                container.innerHTML = '<p style="color:#777;">No data found in Wikipedia categories.</p>';
            }

            document.getElementById('side-panel').classList.add('active');
        }

        // --- 検索機能 (Nominatim) ---
        async function searchCountry(query) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&accept-language=ja`);
            const data = await res.json();

            if (data.length > 0) {
                const target = data[0];
                const country = target.address.country;
                const capital = target.address.city || target.address.town || target.address.state;

                map.flyTo([target.lat, target.lon], 5);
                const airlineData = await getAirlines(country);
                updatePanel(country, capital, airlineData);
            }
        }

        // --- 地図クリック ---
        map.on('click', async (e) => {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${e.latlng.lat}&lon=${e.latlng.lng}&format=json&accept-language=ja`);
            const data = await res.json();

            if (data && data.address && data.address.country) {
                const country = data.address.country;
                const airlineData = await getAirlines(country);
                updatePanel(country, null, airlineData);
            }
        });

        // --- イベント ---
        document.getElementById('search-btn').onclick = () => searchCountry(document.getElementById('country-input').value);
        document.getElementById('close-panel').onclick = () => document.getElementById('side-panel').classList.remove('active');
        document.getElementById('country-input').onkeypress = (e) => { if(e.key === 'Enter') searchCountry(e.target.value); };

        // PWA Service Worker 登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
